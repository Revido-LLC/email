name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  draft-pending:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true && 'Build · typecheck · lint · test' || 'Draft validation sentinel' }}
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo '::error::Draft PR: validation is deferred until ready for review.'
          exit 1

  build:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true && 'Draft deferred - Build · typecheck · lint · test' || 'Build · typecheck · lint · test' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CI routing
        run: node --test scripts/ci-draft-policy.check.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
